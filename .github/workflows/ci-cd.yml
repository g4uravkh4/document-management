name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run API tests
        run: npm test -- --runInBand --passWithNoTests

      - name: Build API
        run: npm run build

      - name: Build web client
        run: npm run build:web

  deploy:
    name: Trigger production deployments
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Vercel deployment
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl --fail --show-error --silent -X POST "$VERCEL_DEPLOY_HOOK_URL"
